# Daisy Health — GitHub Actions CI/CD Workflow
#
# Test pipeline:
#   1. Checkout repository
#   2. Set up Python 3.11
#   3. Install pinned dependencies
#   4. Verify critical dependencies
#   5. Verify project structure
#   6. Validate mock-data JSON
#   7. Validate Python syntax
#   8. Run FastAPI smoke tests
#   9. Verify live MCP tool discovery
#  10. Run integration/routing tests
#  11. Run MCP/mock-data logic tests
#
# Deployment:
#   Deployment ONLY runs after the test job succeeds.
#   FastAPI and Streamlit are deployed through their Render deploy hooks.

name: Daisy Health CI/CD

on:
  push:
    branches:
      - alex-openAILMM

  pull_request:
    branches:
      - alex-openAILMM

jobs:
  # ============================================================
  # TEST JOB
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Python
      # ----------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------------------------------------
      # 3. Cache pip
      # ----------------------------------------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ----------------------------------------------------------
      # 4. Install dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ----------------------------------------------------------
      # 5. Verify critical dependencies
      # ----------------------------------------------------------
      - name: Verify critical dependencies
        run: |
          python -c "from langchain_chroma import Chroma; print('✓ langchain_chroma import OK')"
          python -c "import fastapi; print('✓ FastAPI import OK')"
          python -c "import uvicorn; print('✓ Uvicorn import OK')"
          python -c "import mcp; print('✓ MCP import OK')"

      # ----------------------------------------------------------
      # 6. Verify project structure
      # ----------------------------------------------------------
      - name: Verify project structure
        run: |
          echo "Checking required files and folders..."

          test -f daisy_health_app.py
          echo "✓ daisy_health_app.py"

          test -f api.py
          echo "✓ api.py"

          test -f agent.py
          echo "✓ agent.py"

          test -f rag_backend.py
          echo "✓ rag_backend.py"

          test -f mcp/mcp_server.py
          echo "✓ mcp/mcp_server.py"

          test -f mock_data/employees.json
          echo "✓ mock_data/employees.json"

          test -f mock_data/pto_balances.json
          echo "✓ mock_data/pto_balances.json"

          test -f mock_data/benefits.json
          echo "✓ mock_data/benefits.json"

          test -f mock_data/hr_tickets.json
          echo "✓ mock_data/hr_tickets.json"

          test -d data/handbooks
          echo "✓ data/handbooks/"

          echo "Project structure check passed."

      # ----------------------------------------------------------
      # 7. Validate JSON mock data
      # ----------------------------------------------------------
      - name: Validate mock data JSON files
        run: |
          python - <<'PY'
          import json

          # employees.json
          with open("mock_data/employees.json") as f:
              data = json.load(f)

          count = len(data["employees"])
          assert count >= 20, f"Expected 20+ employees, got {count}"
          print(f"✓ employees.json valid — {count} employees")

          # pto_balances.json
          with open("mock_data/pto_balances.json") as f:
              data = json.load(f)

          count = len(data["pto_balances"])
          assert count >= 20, f"Expected 20+ PTO records, got {count}"
          print(f"✓ pto_balances.json valid — {count} PTO records")

          # benefits.json
          with open("mock_data/benefits.json") as f:
              data = json.load(f)

          count = len(data["benefits"])
          assert count >= 20, f"Expected 20+ benefit records, got {count}"
          print(f"✓ benefits.json valid — {count} benefit records")

          # hr_tickets.json
          with open("mock_data/hr_tickets.json") as f:
              data = json.load(f)

          count = len(data["hr_tickets"])
          print(f"✓ hr_tickets.json valid — {count} tickets")

          print("All mock-data JSON validation passed.")
          PY

      # ----------------------------------------------------------
      # 8. Python syntax
      # ----------------------------------------------------------
      - name: Validate Python syntax
        run: |
          python -m py_compile api.py
          echo "✓ api.py syntax valid"

          python -m py_compile rag_backend.py
          echo "✓ rag_backend.py syntax valid"

          python -m py_compile mcp/mcp_server.py
          echo "✓ mcp_server.py syntax valid"

          python -m py_compile agent.py
          echo "✓ agent.py syntax valid"

          python -m py_compile daisy_health_app.py
          echo "✓ daisy_health_app.py syntax valid"

      # ----------------------------------------------------------
      # 9. FastAPI smoke test
      # ----------------------------------------------------------
      - name: Run API smoke test
        run: |
          # Create test-only environment.
          # These are dummy values and are NOT production secrets.
          echo "OPENAI_API_KEY=test" > .env
          echo "CHROMADB_API_KEY=test" >> .env
          echo "CHROMADB_TENANT=test" >> .env
          echo "CHROMADB_DB=HR_IT" >> .env
          echo "ANTHROPIC_API_KEY=test" >> .env

          # Start FastAPI.
          python -m uvicorn api:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          SERVER_PID=$!

          # Always clean up the server.
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for FastAPI to start..."

          # Wait up to 30 seconds.
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /tmp/health.json; then
              echo "✓ FastAPI is responding"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "✗ FastAPI failed to start"
              echo "----- Uvicorn log -----"
              cat /tmp/uvicorn.log
              exit 1
            fi

            sleep 1
          done

          # ------------------------------------------------------
          # /health
          # ------------------------------------------------------
          HTTP_STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            http://127.0.0.1:8000/health)

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ /health returned HTTP 200"
          else
            echo "✗ /health returned HTTP $HTTP_STATUS"
            cat /tmp/health.json
            exit 1
          fi

          # ------------------------------------------------------
          # /demo
          # ------------------------------------------------------
          HTTP_STATUS=$(curl -s -o /tmp/demo.json -w "%{http_code}" \
            http://127.0.0.1:8000/demo)

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ /demo returned HTTP 200"
          else
            echo "✗ /demo returned HTTP $HTTP_STATUS"
            cat /tmp/demo.json
            exit 1
          fi

          echo "API smoke test passed."

      # ----------------------------------------------------------
      # 10. MCP tool discovery
      # ----------------------------------------------------------
      - name: MCP tool discovery test
        run: |
          python - <<'PY'
          import asyncio
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(".").resolve()))

          from mcp import ClientSession
          from mcp.client.stdio import stdio_client, StdioServerParameters

          REQUIRED_TOOLS = [
              "lookup_employee_profile",
              "check_pto_balance",
              "lookup_benefits_status",
              "search_policy_documents",
              "check_policy_compliance",
              "create_mock_hr_ticket",
              "draft_hr_email",
          ]

          async def test_discovery():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=["mcp/mcp_server.py"],
              )

              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      response = await session.list_tools()
                      discovered = [tool.name for tool in response.tools]

              print(
                  f"MCP server started — "
                  f"{len(discovered)} tools discovered: {discovered}"
              )

              missing = [
                  tool
                  for tool in REQUIRED_TOOLS
                  if tool not in discovered
              ]

              if missing:
                  print(f"✗ Missing MCP tools: {missing}")
                  raise SystemExit(1)

              for tool in REQUIRED_TOOLS:
                  print(f"✓ {tool}")

              print(
                  "MCP tool discovery test passed — "
                  "all required tools verified through live MCP protocol."
              )

          asyncio.run(test_discovery())
          PY

      # ----------------------------------------------------------
      # 11. Integration/routing tests
      # ----------------------------------------------------------
      - name: Run integration and routing tests
        run: |
          python -m unittest discover -s tests -v

      # ----------------------------------------------------------
      # 12. MCP/mock-data logic tests
      # ----------------------------------------------------------
      - name: MCP tool logic test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mock_dir = Path("mock_data")

          # Employee lookup
          with open(mock_dir / "employees.json") as f:
              data = json.load(f)

          employees = {
              employee["employee_id"]: employee
              for employee in data["employees"]
          }

          assert "EMP-001" in employees
          assert employees["EMP-001"]["name"] == "Jordan Rivera"

          print("✓ Employee data lookup works")

          # PTO lookup
          with open(mock_dir / "pto_balances.json") as f:
              data = json.load(f)

          pto = {
              record["employee_id"]: record
              for record in data["pto_balances"]
          }

          assert "EMP-001" in pto
          assert pto["EMP-001"]["available_days"] > 0

          print("✓ PTO balance lookup works")

          # Policy documents
          handbooks = list(Path("data/handbooks").glob("*.pdf"))

          assert len(handbooks) > 0

          print(
              f"✓ Policy documents found: "
              f"{len(handbooks)} files"
          )

          # Benefits
          with open(mock_dir / "benefits.json") as f:
              data = json.load(f)

          benefits = {
              record["employee_id"]: record
              for record in data["benefits"]
          }

          assert "EMP-001" in benefits

          print("✓ Benefits lookup works")

          print("All MCP tool logic tests passed.")
          PY

      # ----------------------------------------------------------
      # 13. Test summary
      # ----------------------------------------------------------
      - name: Tests passed
        run: |
          echo "=========================================="
          echo "✓ ALL DAISY HEALTH TESTS PASSED"
          echo "=========================================="
          echo "Deployment is now permitted."

  # ============================================================
  # DEPLOYMENT JOB
  # ============================================================
  #
  # IMPORTANT:
  # This job cannot run unless the entire test job succeeds.
  #
  deploy:
    name: Deploy to Render
    needs: test

    runs-on: ubuntu-latest

    # Only deploy pushes to alex-openAILMM.
    # Pull requests run tests but do not deploy.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/alex-openAILMM'

    steps:
      # ----------------------------------------------------------
      # 1. Deploy FastAPI
      # ----------------------------------------------------------
      - name: Deploy FastAPI to Render
        env:
          RENDER_FASTAPI_DEPLOY_HOOK: ${{ secrets.RENDER_FASTAPI_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_FASTAPI_DEPLOY_HOOK" ]; then
            echo "✗ RENDER_FASTAPI_DEPLOY_HOOK is not configured."
            exit 1
          fi

          echo "Triggering FastAPI Render deployment..."

          HTTP_STATUS=$(curl -sS \
            -o /tmp/fastapi_deploy_response.txt \
            -w "%{http_code}" \
            -X POST \
            "$RENDER_FASTAPI_DEPLOY_HOOK")

          echo "Render FastAPI deploy hook returned HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "✗ FastAPI deployment trigger failed."
            cat /tmp/fastapi_deploy_response.txt
            exit 1
          fi

          echo "✓ FastAPI deployment triggered successfully."

      # ----------------------------------------------------------
      # 2. Deploy Streamlit
      # ----------------------------------------------------------
      - name: Deploy Streamlit to Render
        env:
          RENDER_STREAMLIT_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_STREAMLIT_DEPLOY_HOOK" ]; then
            echo "✗ RENDER_DEPLOY_HOOK is not configured."
            exit 1
          fi

          echo "Triggering Streamlit Render deployment..."

          HTTP_STATUS=$(curl -sS \
            -o /tmp/streamlit_deploy_response.txt \
            -w "%{http_code}" \
            -X POST \
            "$RENDER_STREAMLIT_DEPLOY_HOOK")

          echo "Render Streamlit deploy hook returned HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "✗ Streamlit deployment trigger failed."
            cat /tmp/streamlit_deploy_response.txt
            exit 1
          fi

          echo "✓ Streamlit deployment triggered successfully."

      # ----------------------------------------------------------
      # 3. Deployment summary
      # ----------------------------------------------------------
      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "✓ DAISY HEALTH DEPLOYMENT TRIGGERED"
          echo "=========================================="
          echo "FastAPI:"
          echo "https://daisy-health.onrender.com"
          echo ""
          echo "Streamlit:"
          echo "https://daisy-health-streamlit.onrender.com"
          echo ""
          echo "Both Render deployments were triggered"
          echo "only after all CI tests passed."
